[project]
name = "structured-output"
version = "0.1.0"
description = "Selfwork Structured Output: due esempi di output strutturati (response_format Pydantic e function calling)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai (>=3.0.0,<4.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
